name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --directory backend --frozen
      - run: uv run --directory backend python -m pytest -q
      - run: uv run --directory backend ruff check app migrations tests ../docker
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  publish:
    name: Build, smoke test and publish info-arena
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ulitkad
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: info-arena:smoke
          cache-from: type=gha,scope=info-arena
          cache-to: type=gha,mode=max,scope=info-arena

      - name: Check demo startup and restart
        run: sh docker/smoke-test.sh info-arena:smoke

      - name: Check standalone two-file deployment
        run: python3 docker/compose-smoke-test.py info-arena:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ulitkad/info-arena:latest
          cache-from: type=gha,scope=info-arena
          cache-to: type=gha,mode=max,scope=info-arena
