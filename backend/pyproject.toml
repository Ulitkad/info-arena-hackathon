[project]
name = "info-arena-api"
version = "1.0.0"
description = "FastAPI backend for the Info Arena MAX Mini App"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.11,<4",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pydantic>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.38,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
